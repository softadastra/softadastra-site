    <style>
      :root {
        --sa-bg: #f3f3f3;
        --sa-bg-raised: #ffffff;
        --sa-bg-soft: #fafafa;
        --sa-border: #e2e2e2;
        --sa-border-strong: #d2d2d2;
        --sa-text: #1f1f1f;
        --sa-muted: #80868b;
        --sa-orange: #d86f1f;
      }

      html,
      body {
        background: var(--sa-bg);
      }

      #app-loading {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--sa-bg);
        z-index: 9999;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 180ms ease,
          visibility 0ms linear 180ms;
      }

      #app-loading.is-hiding {
        opacity: 0;
        visibility: hidden;
      }

      .sa-skeleton {
        min-height: 100vh;
        color: var(--sa-text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }

      .sa-skeleton__header {
        height: 52px;
        border-bottom: 1px solid var(--sa-border);
        background: var(--sa-bg-raised);
      }

      .sa-skeleton__header-inner,
      .sa-skeleton__main {
        width: min(100% - 40px, 1120px);
        margin-inline: auto;
      }

      .sa-skeleton__header-inner {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .sa-skeleton__brand,
      .sa-skeleton__nav,
      .sa-skeleton__actions,
      .sa-skeleton__hero,
      .sa-skeleton__preview,
      .sa-skeleton__cards {
        display: flex;
        align-items: center;
      }

      .sa-skeleton__brand {
        gap: 10px;
        flex: 0 0 auto;
      }

      .sa-skeleton__mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--sa-orange);
      }

      .sa-skeleton__nav,
      .sa-skeleton__actions {
        gap: 8px;
      }

      .sa-skeleton__main {
        padding: 48px 0 72px;
      }

      .sa-skeleton__hero {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(360px, 1.08fr);
        gap: clamp(36px, 6vw, 72px);
        align-items: center;
      }

      .sa-skeleton__copy,
      .sa-skeleton__panel,
      .sa-skeleton__card {
        min-width: 0;
      }

      .sa-skeleton__copy {
        display: grid;
        gap: 18px;
      }

      .sa-skeleton__row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      .sa-skeleton__preview {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--sa-border);
        border-radius: 12px;
        background: var(--sa-bg-raised);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .sa-skeleton__preview-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--sa-border);
      }

      .sa-skeleton__preview-body {
        display: grid;
        gap: 10px;
        padding: 10px 0 2px;
      }

      .sa-skeleton__cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 42px;
      }

      .sa-skeleton__card {
        display: grid;
        gap: 12px;
        min-height: 132px;
        padding: 16px;
        border: 1px solid var(--sa-border);
        border-radius: 10px;
        background: var(--sa-bg-raised);
      }

      .sa-line,
      .sa-block,
      .sa-pill,
      .sa-button,
      .sa-dot {
        position: relative;
        overflow: hidden;
        background: #e7e7e7;
      }

      .sa-line::after,
      .sa-block::after,
      .sa-pill::after,
      .sa-button::after,
      .sa-dot::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.72),
          transparent
        );
        animation: saShimmer 1.35s ease-in-out infinite;
      }

      .sa-line {
        height: 12px;
        border-radius: 5px;
      }

      .sa-line--brand {
        width: 118px;
        height: 16px;
      }

      .sa-line--nav {
        width: 64px;
        height: 10px;
      }

      .sa-line--eyebrow {
        width: 168px;
        height: 24px;
        border-radius: 999px;
      }

      .sa-line--title-lg {
        width: min(100%, 520px);
        height: 48px;
        border-radius: 8px;
      }

      .sa-line--title-md {
        width: min(88%, 460px);
        height: 48px;
        border-radius: 8px;
      }

      .sa-line--text {
        width: min(100%, 520px);
      }

      .sa-line--text-short {
        width: min(72%, 380px);
      }

      .sa-button {
        width: 128px;
        height: 40px;
        border-radius: 7px;
      }

      .sa-button--accent {
        background: var(--sa-orange);
      }

      .sa-pill {
        width: 86px;
        height: 26px;
        border-radius: 999px;
      }

      .sa-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .sa-block {
        height: 52px;
        border-radius: 8px;
      }

      @keyframes saShimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @media (max-width: 860px) {
        .sa-skeleton__nav,
        .sa-skeleton__actions {
          display: none;
        }

        .sa-skeleton__hero,
        .sa-skeleton__cards {
          grid-template-columns: 1fr;
        }

        .sa-skeleton__hero {
          gap: 34px;
        }
      }

      @media (max-width: 520px) {
        .sa-skeleton__header-inner,
        .sa-skeleton__main {
          width: min(100% - 28px, 1120px);
        }

        .sa-skeleton__main {
          padding-top: 34px;
        }

        .sa-skeleton__row .sa-button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sa-line::after,
        .sa-block::after,
        .sa-pill::after,
        .sa-button::after,
        .sa-dot::after {
          animation: none;
        }
      }
    </style>

    <script>
      window.addEventListener("load", function () {
        const loader = document.getElementById("app-loading");

        if (!loader) {
          return;
        }

        loader.classList.add("is-hiding");

        window.setTimeout(function () {
          loader.remove();
        }, 220);
      });
    </script>
